---
- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
  become: yes

- name: Stop existing backend process if running
  ansible.builtin.shell: |
    pm2 delete travelmemory-backend || true
  become: yes
  become_user: ubuntu

- name: Start backend using PM2
  ansible.builtin.shell: |
    pm2 start index.js --name travelmemory-backend
  args:
    chdir: /opt/travelmemory/backend
  become: yes
  become_user: ubuntu

- name: Save PM2 process list
  ansible.builtin.shell: pm2 save
  become: yes
  become_user: ubuntu

- name: Configure PM2 to start on boot
  ansible.builtin.shell: |
    pm2 startup systemd -u ubuntu --hp /home/ubuntu
  become: yes
